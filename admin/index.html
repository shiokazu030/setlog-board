<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>管理画面｜setlog募集ボード</title>
    <meta name="description" content="setlog募集ボードの簡易管理画面です。" />
    <style>
:root {
  color-scheme: light;
  --pink: #ff4f93;
  --pink-soft: #ffe7f1;
  --pink-strong: #e72d78;
  --ink: #171217;
  --muted: #756b72;
  --line: #efe2e9;
  --surface: #ffffff;
  --bg: #fff7fb;
  --danger: #d9224a;
  font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(180deg, #ffe1ee 0, #fff8fb 220px, #f7f7f8 100%);
  color: var(--ink);
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

.phone-shell {
  width: min(100%, 440px);
  min-height: 100vh;
  margin: 0 auto;
  padding: 14px 14px 92px;
  background: var(--bg);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.03), 0 22px 60px rgba(23, 18, 23, 0.08);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  background: rgba(255, 247, 251, 0.92);
  backdrop-filter: blur(14px);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
}

.brand-mark {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 10px;
  background: var(--ink);
  color: white;
}

.mini-link {
  padding: 8px 10px;
  border-radius: 999px;
  background: white;
  color: var(--pink-strong);
  font-size: 12px;
  font-weight: 700;
}

.safety-strip,
.notice {
  border: 1px solid #ffd0e1;
  border-radius: 16px;
  background: #fff;
  color: #b01851;
  font-size: 12px;
  font-weight: 700;
}

.safety-strip {
  margin: 4px 0 14px;
  padding: 10px 12px;
}

.hero {
  padding: 28px 8px 18px;
}

.eyebrow {
  display: inline-flex;
  margin: 0 0 10px;
  padding: 7px 10px;
  border-radius: 999px;
  background: white;
  color: var(--pink-strong);
  font-size: 12px;
  font-weight: 800;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 10px;
  font-size: 34px;
  line-height: 1.15;
  letter-spacing: 0;
}

h2 {
  margin-bottom: 12px;
  font-size: 19px;
  letter-spacing: 0;
}

h3 {
  margin-bottom: 4px;
  font-size: 18px;
}

.hero-copy {
  margin-bottom: 18px;
  color: #4d424a;
  font-weight: 700;
}

.hero-actions,
.card-actions,
.select-row {
  display: flex;
  gap: 10px;
}

.notice {
  display: inline-flex;
  margin: 16px 0 0;
  padding: 9px 12px;
}

.link-button,
button {
  min-height: 44px;
  border: 0;
  border-radius: 16px;
  cursor: pointer;
  font-weight: 800;
}

.link-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
}

.primary {
  background: var(--pink);
  color: white;
  box-shadow: 0 8px 22px rgba(255, 79, 147, 0.28);
}

.secondary,
.ghost {
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
}

.danger {
  background: var(--danger);
  color: white;
}

.full {
  width: 100%;
}

.section,
.seo-text,
.page-head,
.form-card,
.info-list article,
.filters,
.empty,
.preview {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  padding: 16px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.section-title a {
  color: var(--pink-strong);
  font-size: 13px;
  font-weight: 800;
}

.stack {
  display: grid;
  gap: 12px;
}

.post-card {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: #fff;
  padding: 14px;
  box-shadow: 0 10px 28px rgba(23, 18, 23, 0.05);
}

.card-head,
.time-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.id-line {
  margin-bottom: 0;
  color: var(--pink-strong);
  font-weight: 800;
  overflow-wrap: anywhere;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0;
  color: var(--muted);
  font-size: 12px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chips span,
.chips a,
.warn-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 28px;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--pink-soft);
  color: #a81550;
  font-size: 12px;
  font-weight: 800;
}

.chips.large a {
  min-height: 36px;
  padding: 7px 11px;
}

.chips small {
  color: var(--muted);
}

.warn-chip {
  background: #fff1c7;
  color: #8a5a00;
  white-space: nowrap;
}

.message {
  margin: 12px 0;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.time-row {
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 12px;
}

.card-actions button {
  flex: 1;
  padding: 0 12px;
}

.empty {
  text-align: center;
}

.empty p,
.page-head p,
.seo-text p,
.info-list p,
.muted {
  color: var(--muted);
  line-height: 1.7;
}

.filters {
  display: grid;
  gap: 10px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
  padding: 12px 13px;
  color: var(--ink);
}

textarea {
  min-height: 96px;
  resize: vertical;
}

.select-row {
  display: grid;
  grid-template-columns: 1fr;
}

.form-card {
  display: grid;
  gap: 14px;
}

label,
legend {
  color: #31282f;
  font-size: 13px;
  font-weight: 800;
}

label input,
label select,
label textarea {
  margin-top: 7px;
}

fieldset {
  margin: 0;
  border: 0;
  padding: 0;
}

.tag-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 9px;
}

.tag-picker label,
.agree {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: white;
  padding: 7px 10px;
}

.tag-picker input,
.agree input {
  width: auto;
  margin: 0;
  accent-color: var(--pink);
}

.errors {
  color: var(--danger);
  font-size: 13px;
  font-weight: 700;
}

.errors p {
  margin-bottom: 6px;
}

.info-list {
  display: grid;
  gap: 12px;
}

.bottom-nav {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 8;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  width: min(100%, 440px);
  margin: 0 auto;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
}

.bottom-nav a {
  display: grid;
  gap: 3px;
  place-items: center;
  min-height: 64px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.bottom-nav span {
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border-radius: 10px;
  background: #f5edf2;
  font-size: 15px;
}

.bottom-nav a.active {
  color: var(--pink-strong);
}

.bottom-nav a.active span {
  background: var(--pink);
  color: white;
}

.toast {
  position: fixed;
  right: 18px;
  bottom: 82px;
  left: 18px;
  z-index: 20;
  max-width: 404px;
  margin: 0 auto;
  transform: translateY(18px);
  border-radius: 16px;
  background: var(--ink);
  color: white;
  opacity: 0;
  padding: 13px 15px;
  text-align: center;
  pointer-events: none;
  transition: 0.2s ease;
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

@media (min-width: 700px) {
  body {
    padding: 28px 0;
  }

  .phone-shell {
    border-radius: 34px;
    overflow: hidden;
  }

  .bottom-nav {
    border-right: 1px solid var(--line);
    border-left: 1px solid var(--line);
    border-radius: 24px 24px 0 0;
  }
}

</style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
const SITE = {
  name: "setlog募集ボード",
  baseUrl: "https://setlog-board.pages.dev",
  adminPassword: "setlog-admin"
};

const TAGS = [
  "今日だけ",
  "顔出しなし",
  "初心者歓迎",
  "学生",
  "大学生",
  "社会人",
  "K-POP",
  "推し活",
  "日常ログ",
  "夜だけ",
  "ゆる募"
];

const AGE_GROUPS = ["学生", "大学生", "社会人", "20代", "非公開"];
const FACE_OPTIONS = ["あり", "なし", "どちらでも"];

const NG_WORDS = [
  "彼氏",
  "彼女",
  "会いたい",
  "通話しよ",
  "住所",
  "学校名",
  "LINE",
  "line",
  "ライン",
  "電話番号",
  "電話",
  "本名",
  "恋人",
  "出会い",
  "出会お",
  "付き合",
  "性的",
  "エロ",
  "セフレ",
  "DMして",
  "インスタ",
  "Instagram",
  "discord",
  "カカオ"
];

const PERSONAL_INFO_PATTERNS = [
  { label: "電話番号の可能性がある数字列", pattern: /0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{3,4}/ },
  { label: "メールアドレス", pattern: /[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i },
  { label: "LINE IDらしき表現", pattern: /(LINE|line|ライン)\s*(ID|id|交換|追加|教え)/i },
  { label: "住所らしき表現", pattern: /(都|道|府|県|市|区|町|村).{0,8}(丁目|番地|在住|住み)/ },
  { label: "学校名らしき表現", pattern: /(小学校|中学校|高校|高等学校|大学|専門学校|学院)/ }
];

const PAGE_COPY = {
  safetyNote: "出会い目的・個人情報投稿は禁止です。setlog ID以外の連絡先は載せないでください。"
};


const STORAGE_KEY = "setlog-board-posts-v1";
const LIFETIME_HOURS = 72;

const read = () => {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  } catch {
    return [];
  }
};

const write = (posts) => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
};

const now = () => new Date();

const postsService = {
  getAll({ includeExpired = false, includeReported = false } = {}) {
    const current = now();
    return read()
      .filter((post) => includeExpired || new Date(post.expiresAt) > current)
      .filter((post) => includeReported || !post.reported)
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  },

  create(input) {
    const createdAt = now();
    const expiresAt = new Date(createdAt.getTime() + LIFETIME_HOURS * 60 * 60 * 1000);
    const post = {
      id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
      nickname: input.nickname.trim(),
      setlogId: input.setlogId.trim(),
      ageGroup: input.ageGroup,
      faceOption: input.faceOption,
      tags: input.tags,
      message: input.message.trim(),
      createdAt: createdAt.toISOString(),
      expiresAt: expiresAt.toISOString(),
      reported: false
    };

    write([post, ...read()]);
    return post;
  },

  report(id) {
    const posts = read().map((post) => (post.id === id ? { ...post, reported: true } : post));
    write(posts);
  },

  unreport(id) {
    const posts = read().map((post) => (post.id === id ? { ...post, reported: false } : post));
    write(posts);
  },

  remove(id) {
    write(read().filter((post) => post.id !== id));
  },

  getPopularTags(tags) {
    const counts = new Map(tags.map((tag) => [tag, 0]));
    this.getAll().forEach((post) => {
      post.tags.forEach((tag) => counts.set(tag, (counts.get(tag) || 0) + 1));
    });

    return [...counts.entries()]
      .sort((a, b) => b[1] - a[1] || tags.indexOf(a[0]) - tags.indexOf(b[0]))
      .map(([tag, count]) => ({ tag, count }));
  }
};



const app = document.querySelector("#app");
const route = normalizePath(location.pathname);
let toastTimer;

const escapeHtml = (value = "") =>
  String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

function normalizePath(path) {
  const clean = path.replace(/\/index\.html$/, "").replace(/\/$/, "");
  return clean || "/";
}

function shell(content) {
  app.innerHTML = `
    <main class="phone-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="setlog募集ボード ホーム">
          <span class="brand-mark">s</span>
          <span>setlog募集ボード</span>
        </a>
        <a class="mini-link" href="/safe">安全ガイド</a>
      </header>
      <div class="safety-strip">${PAGE_COPY.safetyNote}</div>
      ${content}
      <nav class="bottom-nav" aria-label="メインナビゲーション">
        ${navItem("/", "ホーム", "⌂")}
        ${navItem("/board", "募集", "▦")}
        ${navItem("/post", "投稿", "+")}
        ${navItem("/how-to-use", "使い方", "?")}
        ${navItem("/rules", "ルール", "✓")}
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  `;
}

function navItem(href, label, icon) {
  const active = route === href;
  return `<a class="${active ? "active" : ""}" href="${href}"><span>${icon}</span>${label}</a>`;
}

function showToast(message) {
  const toast = document.querySelector("#toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}

function postCard(post, { admin = false } = {}) {
  return `
    <article class="post-card" data-id="${post.id}">
      <div class="card-head">
        <div>
          <h3>${escapeHtml(post.nickname)}</h3>
          <p class="id-line">@${escapeHtml(post.setlogId)}</p>
        </div>
        ${post.reported ? '<span class="warn-chip">通報あり</span>' : ""}
      </div>
      <div class="meta-grid">
        <span>年齢層：${escapeHtml(post.ageGroup)}</span>
        <span>顔出し：${escapeHtml(post.faceOption)}</span>
      </div>
      <div class="chips">${post.tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("")}</div>
      <p class="message">${escapeHtml(post.message || "一言はありません")}</p>
      <div class="time-row">
        <span>${formatRelative(post.createdAt)}</span>
        <span>残り${remainingTime(post.expiresAt)}</span>
      </div>
      <div class="card-actions">
        <button class="primary copy-btn" data-copy="${escapeHtml(post.setlogId)}">setlog IDコピー</button>
        ${
          admin
            ? `<button class="ghost unreport-btn">通報解除</button><button class="danger delete-btn">削除</button>`
            : `<button class="ghost report-btn">通報</button>`
        }
      </div>
    </article>
  `;
}

function emptyState() {
  return `
    <section class="empty">
      <h2>まだ募集がありません</h2>
      <p>最初の募集を投稿してみよう。</p>
      <a class="primary link-button" href="/post">募集する</a>
    </section>
  `;
}

function formatRelative(dateString) {
  const diff = Date.now() - new Date(dateString).getTime();
  const minutes = Math.max(1, Math.floor(diff / 60000));
  if (minutes < 60) return `${minutes}分前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}時間前`;
  return `${Math.floor(hours / 24)}日前`;
}

function remainingTime(dateString) {
  const diff = new Date(dateString).getTime() - Date.now();
  if (diff <= 0) return "0分";
  const hours = Math.floor(diff / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  return hours > 0 ? `${hours}時間` : `${minutes}分`;
}

function bindCardActions() {
  document.querySelectorAll(".copy-btn").forEach((button) => {
    button.addEventListener("click", async () => {
      await navigator.clipboard.writeText(button.dataset.copy);
      showToast("コピーしました");
    });
  });

  document.querySelectorAll(".report-btn").forEach((button) => {
    button.addEventListener("click", () => {
      const card = button.closest(".post-card");
      postsService.report(card.dataset.id);
      card.remove();
      showToast("通報しました。投稿は非表示になります。");
      if (!document.querySelector(".post-card")) {
        document.querySelector("#post-list")?.insertAdjacentHTML("beforeend", emptyState());
      }
    });
  });
}

function renderHome() {
  const posts = postsService.getAll().slice(0, 3);
  const popular = postsService.getPopularTags(TAGS).slice(0, 8);
  shell(`
    <section class="hero">
      <p class="eyebrow">setlog ID募集掲示板</p>
      <h1>setlog仲間を探せる募集掲示板</h1>
      <p class="hero-copy">顔出しなしOK・今日だけOK・タグで探せる</p>
      <div class="hero-actions">
        <a class="primary link-button" href="/board">募集を見る</a>
        <a class="secondary link-button" href="/post">募集する</a>
      </div>
      <p class="notice">出会い目的・個人情報投稿は禁止です</p>
    </section>

    <section class="section">
      <div class="section-title">
        <h2>新着のsetlog募集</h2>
        <a href="/board">すべて見る</a>
      </div>
      <div id="post-list" class="stack">${posts.length ? posts.map((post) => postCard(post)).join("") : emptyState()}</div>
    </section>

    <section class="section">
      <h2>人気タグでsetlog ID交換を探す</h2>
      <div class="chips large">${popular.map(({ tag, count }) => `<a href="/board?tag=${encodeURIComponent(tag)}">${tag}<small>${count}</small></a>`).join("")}</div>
    </section>

    <section class="seo-text">
      <h2>セットログ友達募集を流れずに見つける</h2>
      <p>setlog募集ボードは、setlogを一緒に楽しむ人を探せる募集掲示板です。Xでは流れてしまうsetlog ID募集を、顔出しなし・今日だけ・学生・K-POP・推し活などのタグで探しやすく整理できます。</p>
    </section>
  `);
  bindCardActions();
}

function renderBoard() {
  const params = new URLSearchParams(location.search);
  const filterTags = getFilterTags();
  shell(`
    <section class="page-head">
      <h1>募集一覧</h1>
      <p>setlog募集、setlog ID交換、セットログ友達募集を条件で探せます。</p>
    </section>
    <section class="filters" aria-label="募集検索フィルター">
      <input id="q" type="search" placeholder="ニックネーム・ID・一言・タグで検索" value="${escapeHtml(params.get("q") || "")}" />
      <div class="select-row">
        <select id="tag"><option value="">タグすべて</option>${filterTags.map((tag) => `<option ${params.get("tag") === tag ? "selected" : ""}>${escapeHtml(tag)}</option>`).join("")}</select>
        <select id="age"><option value="">年齢層すべて</option>${AGE_GROUPS.map((age) => `<option>${age}</option>`).join("")}</select>
        <select id="face"><option value="">顔出しすべて</option>${FACE_OPTIONS.map((face) => `<option>${face}</option>`).join("")}</select>
      </div>
    </section>
    <section class="section">
      <h2>新着順のsetlog募集</h2>
      <div id="post-list" class="stack"></div>
    </section>
  `);

  const renderList = () => {
    const q = document.querySelector("#q").value.trim().toLowerCase();
    const tag = document.querySelector("#tag").value;
    const age = document.querySelector("#age").value;
    const face = document.querySelector("#face").value;
    const posts = postsService.getAll().filter((post) => {
      const haystack = [post.nickname, post.setlogId, post.message, ...post.tags].join(" ").toLowerCase();
      return (!q || haystack.includes(q)) && (!tag || post.tags.includes(tag)) && (!age || post.ageGroup === age) && (!face || post.faceOption === face);
    });
    document.querySelector("#post-list").innerHTML = posts.length ? posts.map((post) => postCard(post)).join("") : emptyState();
    bindCardActions();
  };

  ["q", "tag", "age", "face"].forEach((id) => document.querySelector(`#${id}`).addEventListener("input", renderList));
  renderList();
}

function getFilterTags() {
  const customTags = postsService
    .getAll()
    .flatMap((post) => post.tags)
    .filter((tag) => !TAGS.includes(tag));
  return [...new Set([...TAGS, ...customTags])];
}

  const form = document.querySelector("#post-form");

      id: "preview",

      setlogId: data.setlogId || "setlog_id",
      ageGroup: data.ageGroup,
      faceOption: data.faceOption,

      createdAt: new Date().toISOString(),
      expiresAt: new Date(Date.now() + 72 * 3600000).toISOString(),

    };
    document.querySelector("#preview").innerHTML = `<h2>投稿プレビュー</h2>${postCard(previewPost)}`;

function formData(form) {
  const formDataObject = new FormData(form);
  const customTags = String(formDataObject.get("customTags") || "")
    .split(/[,\s、]+/)
    .map((tag) => tag.trim().replace(/^#/, ""))
    .filter(Boolean);
  const tags = [...new Set([...formDataObject.getAll("tags"), ...customTags])];
  return {
    nickname: formDataObject.get("nickname") || "",
    setlogId: formDataObject.get("setlogId") || "",
    ageGroup: formDataObject.get("ageGroup"),
    faceOption: formDataObject.get("faceOption"),
    tags,
    message: formDataObject.get("message") || "",
    agree: formDataObject.get("agree") === "on"
  };
}

function validatePost(data) {
  const errors = [];
  const combined = `${data.nickname} ${data.setlogId} ${data.message} ${data.tags.join(" ")}`;
  if (!data.nickname.trim()) errors.push("ニックネームを入力してください。");
  if (data.nickname.length > 20) errors.push("ニックネームは20文字以内です。");
  if (!/^[A-Za-z0-9_.-]+$/.test(data.setlogId)) errors.push("setlog IDは英数字、アンダースコア、ドット、ハイフンのみ使えます。");
  if (data.message.length > 80) errors.push("一言は80文字以内です。");
  if (data.tags.length > 8) errors.push("タグは合計8個までです。");
  data.tags.forEach((tag) => {
    if (tag.length > 12) errors.push(`自由タグ「${tag}」は12文字以内にしてください。`);
    if (!/^[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}A-Za-z0-9ー_.-]+$/u.test(tag)) {
      errors.push(`自由タグ「${tag}」に使えない文字が含まれています。`);
    }
  });
  if (!data.agree) errors.push("利用ルールへの同意が必要です。");
  NG_WORDS.forEach((word) => {
    if (combined.toLowerCase().includes(word.toLowerCase())) errors.push(`禁止ワード「${word}」が含まれています。`);
  });
  PERSONAL_INFO_PATTERNS.forEach(({ label, pattern }) => {
    if (pattern.test(combined)) errors.push(`${label}は投稿できません。`);
  });
  return [...new Set(errors)];
}

      <form id="admin-login" class="form-card">

        <button class="primary full" type="submit">ログイン</button>

    `);
    document.querySelector("#admin-login").addEventListener("submit", (event) => {
      event.preventDefault();

  }

  const posts = postsService.getAll({ includeExpired: true, includeReported: true });

    });
  });
}
